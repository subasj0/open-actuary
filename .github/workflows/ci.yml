name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler d1 migrations apply open-actuary --local
      - name: Verify account, OAuth, and content workflows
        run: |
          npx wrangler dev --local --port 8787 > /tmp/open-actuary.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/tests/accounts.mjs
          node scripts/tests/oauth.mjs
          python3 scripts/tests/content-integration.py
