name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: fe70503d136ba9d31118cd7e7f756483
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure repository secret CLOUDFLARE_API_TOKEN first.'; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler d1 migrations apply open-actuary --remote
      - run: npx wrangler deploy
      - run: curl --fail --retry 3 https://open-actuary.subasj02.workers.dev/api/health
